name: Publish widget package

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (example: v1.x.x)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  PACKAGE_NAME: kommo-widget
  OWNER_SCOPE: orgs

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v$(jq -r '.widget.version' custom-widget/manifest.json)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=custom-widget-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build widget zip
        shell: bash
        run: |
          cd custom-widget
          zip -r "../${{ steps.meta.outputs.zip_name }}" .

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: widget
          path: ${{ steps.meta.outputs.zip_name }}

      - name: Create tag
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Release ${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (generic)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          curl --fail-with-body -L \
            -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @"${ZIP_NAME}" \
            "https://api.github.com/${OWNER_SCOPE}/${OWNER}/packages/generic/${PACKAGE_NAME}/${VERSION}/${ZIP_NAME}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Release ${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
